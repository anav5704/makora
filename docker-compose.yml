services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.docker
    environment:
      - REDIS_URL=redis://redis:6379
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - apps/api/.env.docker
    environment:
      - REDIS_URL=redis://redis:6379
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
      - CORS_ORIGIN=http://localhost:3000
      - API_PORT=4000
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy
      redis:
        condition: service_healthy

  openings:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/openings/Dockerfile
    ports:
      - "4001:4001"
    env_file:
      - apps/openings/.env.docker
    environment:
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
      - OPENINGS_PORT=4001
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy

  sync:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
      - OPENINGS_URL=http://openings:4001
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy
      redis:
        condition: service_healthy
      openings:
        condition: service_started

  analysis:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        INSTALL_STOCKFISH: "true"
    environment:
      - REDIS_URL=redis://redis:6379
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
    command: ["bun", "src/analysis.worker.ts"]
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres-main:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-main-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-chess:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-chess-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-main-data:
  postgres-chess-data:
  redis-data:
