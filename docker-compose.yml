services:
  postgres-main:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-main-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-chess:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-chess-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAIN_DATABASE_URL: ${MAIN_DATABASE_URL:-placeholder}
        CHESS_DATABASE_URL: ${CHESS_DATABASE_URL:-placeholder}
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.docker
    environment:
      - REDIS_URL=redis://redis:6379
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-sync:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        MAIN_DATABASE_URL: ${MAIN_DATABASE_URL:-placeholder}
        CHESS_DATABASE_URL: ${CHESS_DATABASE_URL:-placeholder}
    environment:
      - REDIS_URL=redis://redis:6379
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-analysis:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        INSTALL_STOCKFISH: "true"
        MAIN_DATABASE_URL: ${MAIN_DATABASE_URL:-placeholder}
        CHESS_DATABASE_URL: ${CHESS_DATABASE_URL:-placeholder}
    environment:
      - REDIS_URL=redis://redis:6379
      - MAIN_DATABASE_URL=postgres://postgres:postgres@postgres-main:5432/main_db
      - CHESS_DATABASE_URL=postgres://postgres:postgres@postgres-chess:5432/chess_db
    command: ["bun", "src/analysis.worker.ts"]
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-chess:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-main-data:
  postgres-chess-data:
  redis-data:
